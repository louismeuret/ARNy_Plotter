<div class="box mt-5">
    <div class="flex-container">
        <div id="{{ plot_info[0] }}" class="plot"></div>
        <i class="drag-handle" data-lucide="grip"></i>
        <i class="expand-icon" data-lucide="expand"></i>
    </div>
    <div id="{{ plot_info[1] }}"></div>
    <div class="content">
        <h2>{{ explainations.get(plot_info[0]).title }}</h2>
        <p>{{ explainations.get(plot_info[0]).content }}</p>
        {% if explainations.get(plot_info[0]).formula != "" %}
        <div class="formula">
            {{ explainations.get(plot_info[0]).formula | safe }}
        </div>
        {% endif %}
    </div>
    <script>
    (function() {
        var plotId = '{{ plot_info[1] }}';
        var sessionId = '{{ session_id }}';
        var currentMode = 'timeline';

        var plotDataTimeline = null;
        var plotDataPie = null;
        var dataValid = true;

        plotDataTimeline = {{ plot_info[2][0] | safe }};
        plotDataPie = {{ plot_info[2][1] | safe }};

        var timelineLayout = { margin: { t: 10, r: 10, l: 50, b: 50 }, autosize: true };
        var pieLayout = { margin: { t: 50, r: 150, l: 20, b: 20 }, autosize: true };

        function initPlot() {

            PlotUtils.initPlot(plotId, plotDataTimeline, timelineLayout);
            PlotUtils.registerResize(plotId);

            plotEl.on('plotly_click', function(data) {
                if (currentMode !== 'timeline') return;
                if (data.points && data.points.length > 0) {
                    PlotUtils.handleFrameSelection(data.points[0].x, sessionId);
                }
            });

            PlotUtils.setupExpandHandler(plotEl.closest('.box'), plotId);
        }

        window['switchDotbracketMode_' + plotId] = function(mode) {
            if (!dataValid) return;
            var plotDiv = document.getElementById(plotId);
            if (!plotDiv) return;

            if (mode === 'timeline') {
                Plotly.react(plotDiv, plotDataTimeline, timelineLayout, PlotUtils.defaultConfig);
                document.getElementById('btnTimeline_' + plotId).classList.add('is-active');
                document.getElementById('btnPie_' + plotId).classList.remove('is-active');
                currentMode = 'timeline';
            } else {
                Plotly.react(plotDiv, plotDataPie, pieLayout, PlotUtils.defaultConfig);
                document.getElementById('btnPie_' + plotId).classList.add('is-active');
                document.getElementById('btnTimeline_' + plotId).classList.remove('is-active');
                currentMode = 'pie';
            }
            setTimeout(function() { Plotly.Plots.resize(plotDiv); }, 100);
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initPlot);
        } else {
            setTimeout(initPlot, 50);
        }
    })();
    </script>

    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px; margin-bottom: 10px;">
        <button id="btnTimeline_{{ plot_info[1] }}" class="button is-link is-active" onclick="switchDotbracketMode_{{ plot_info[1] }}('timeline')">Timeline</button>
        <button id="btnPie_{{ plot_info[1] }}" class="button is-link" onclick="switchDotbracketMode_{{ plot_info[1] }}('pie')">Population</button>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
        <a href="{{ url_for('download_plot_data', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download {{ plot_info[0] }} Data</a>
        <a href="{{ url_for('download_plot', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download Plot</a>
    </div>
</div>
