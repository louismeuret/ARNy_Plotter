<div class="box mt-5">
    <div class="flex-container">
        <div id="{{ plot_info[0] }}" class="plot"></div>
    </div>
    <div id="{{ plot_info[1] }}" style="width: 100%; height: 100%;"></div>
    <div class="content">
        <h2>{{ explainations.get(plot_info[0]).title }}</h2>
        <p>{{ explainations.get(plot_info[0]).content }}</p>
        {% if explainations.get(plot_info[0]).formula != "" %}
        <div class="formula">
            {{ explainations.get(plot_info[0]).formula | safe }}
        </div>
        {% endif %}
    </div>

    <script>
    (function() {
        var plotId = '{{ plot_info[1] }}';
        var sessionId = '{{ session_id }}';
        var plotDataContact = {{ plot_info[2] | safe }};
        var plotDataStacking = null;
        var currentMode = 'contact';

        // Get socket using shared utility
        var socket = PlotUtils.getSocket(sessionId);
        socket.emit('join', { room: sessionId });

        // Initialize plot with contact map data
        PlotUtils.initPlot(plotId, plotDataContact).then(function() {
            // Register for frame updates
            if (typeof window.contactMapFrameListeners === 'undefined') {
                window.contactMapFrameListeners = [];
            }
            window.contactMapFrameListeners.push({
                plotId: plotId,
                sendSliderValue: sendSliderValue,
                sendStackingSliderValue: sendStackingSliderValue
            });
            // Pre-load stacking data for initial frame
            sendStackingSliderValue(1);
        });

        // Register for window resize
        PlotUtils.registerResize(plotId);

        // Mode switch function
        window.switchContactMode = function(mode) {
            var plotDiv = document.getElementById(plotId);
            if (mode === 'contact') {
                Plotly.react(plotDiv, plotDataContact);
                document.getElementById('btnContactMap').classList.add('is-active');
                document.getElementById('btnStackingMap').classList.remove('is-active');
                currentMode = 'contact';
            } else if (mode === 'stacking') {
                if (plotDataStacking) {
                    Plotly.react(plotDiv, plotDataStacking);
                    document.getElementById('btnStackingMap').classList.add('is-active');
                    document.getElementById('btnContactMap').classList.remove('is-active');
                    currentMode = 'stacking';
                } else {
                    sendStackingSliderValue(1);
                }
            }
        };

        // Debounced send functions to prevent excessive server requests
        var sendSliderValue = PlotUtils.debounce(function(value) {
            socket.emit('update_contact_map', {
                value: value,
                session_id: sessionId
            }, sessionId);
        }, 300);

        var sendStackingSliderValue = PlotUtils.debounce(function(value) {
            socket.emit('update_stacking_map', {
                value: value,
                session_id: sessionId
            }, sessionId);
        }, 300);

        // Frame slider listener
        var frameSlider = document.getElementById('frame-slider');
        var frameNumber = document.getElementById('frame-number');

        function onFrameChange(value) {
            sendSliderValue(value);
            sendStackingSliderValue(value);
        }

        if (frameSlider) {
            frameSlider.addEventListener('input', function() {
                onFrameChange(parseInt(this.value));
            });
        }
        if (frameNumber) {
            frameNumber.addEventListener('input', function() {
                onFrameChange(parseInt(this.value));
            });
        }

        // Handle contact map updates from server
        socket.on('contact_map_plot_update', function(data) {
            var plotData = JSON.parse(data.plotData);
            plotDataContact = plotData.data;
            if (currentMode === 'contact') {
                Plotly.react(document.getElementById(plotId), plotData.data);
            }
        });

        // Handle stacking map updates from server
        socket.on('stacking_map_plot_update', function(data) {
            var plotData = JSON.parse(data.plotData);
            plotDataStacking = plotData.data;
            if (currentMode === 'stacking') {
                Plotly.react(document.getElementById(plotId), plotData.data);
                document.getElementById('btnStackingMap').classList.add('is-active');
                document.getElementById('btnContactMap').classList.remove('is-active');
            }
        });

        // Track highlighted residue pair for contact map
        var highlightedPair = null;

        // Click handler to highlight nucleotides in 3D viewer
        var plotEl = document.getElementById(plotId);
        plotEl.on('plotly_click', function(data) {
            if (data.points.length === 0) return;

            // Get the two residue indices from the clicked point
            var resid1 = parseInt(data.points[0].x);
            var resid2 = parseInt(data.points[0].y);

            // Check if viewer is ready
            if (typeof state === 'undefined' || !state.viewerReady) return;

            // Check if clicking on the same pair (toggle off)
            if (highlightedPair && highlightedPair[0] === resid1 && highlightedPair[1] === resid2) {
                // Remove highlighting
                if (typeof hideColor === 'function') {
                    hideColor();
                }
                highlightedPair = null;
                state.highlightedResid = undefined;
            } else {
                // Clear previous highlighting
                if (highlightedPair || state.highlightedResid !== undefined) {
                    if (typeof hideColor === 'function') {
                        hideColor();
                    }
                }

                // Highlight both residues with different colors
                if (typeof LouisMolStarWrapper !== 'undefined' && LouisMolStarWrapper.interactivity) {
                    // Use highlightMultiple to avoid race conditions
                    if (LouisMolStarWrapper.interactivity.highlightMultiple) {
                        LouisMolStarWrapper.interactivity.highlightMultiple([
                            { seqId: resid1, color: 0xFF00FF },  // Magenta
                            { seqId: resid2, color: 0x00FFFF }   // Cyan
                        ]);
                    } else {
                        // Fallback for older versions
                        LouisMolStarWrapper.interactivity.highlightOn(resid1, 0xFF00FF);
                    }

                    // Focus camera on both residues
                    if (LouisMolStarWrapper.camera && LouisMolStarWrapper.camera.focus) {
                        LouisMolStarWrapper.camera.focus([resid1, resid2]);
                    }
                }

                highlightedPair = [resid1, resid2];
                state.highlightedResid = resid1; // Track for arc plot compatibility
            }
        });

        // Set up expand icon handler
        var container = document.getElementById(plotId).closest('.box');
        PlotUtils.setupExpandHandler(container, plotId);
    })();
    </script>

    <!-- Toggle buttons for Contact Map/Stacking Map -->
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px; margin-bottom: 10px;">
        <button id="btnContactMap" class="button is-link is-active" onclick="switchContactMode('contact')">Contact Map</button>
        <button id="btnStackingMap" class="button is-link" onclick="switchContactMode('stacking')">Stacking Map</button>
    </div>

    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
        <a href="{{ url_for('download_plot_data', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download {{ plot_info[0] }} Data</a>
        <a href="{{ url_for('download_plot', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download Plot</a>
    </div>
</div>
