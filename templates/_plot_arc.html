<div class="box mt-5">
    <div class="flex-container">
        <div id="{{ plot_info[0] }}" class="plot"></div>
        <i class="drag-handle" data-lucide="grip"></i>
        <i class="expand-icon" data-lucide="expand"></i>
    </div>
    <div id="{{ plot_info[1] }}" style="width: 100%; height: 100%; display: flex; justify-content: center; align-items: center;"></div>
    <div class="content">
        <h2>{{ explainations.get(plot_info[0]).title }}</h2>
        <p>{{ explainations.get(plot_info[0]).content }}</p>
        {% if explainations.get(plot_info[0]).formula != "" %}
        <div class="formula">
            {{ explainations.get(plot_info[0]).formula | safe }}
        </div>
        {% endif %}
    </div>
    <script>
    (function() {
        var plotId = '{{ plot_info[1] }}';
        var resids = {{ plot_info[2][1] | tojson | safe }};
        var plotData = {{ plot_info[2][0] | safe }};

        // Initialize plot
        PlotUtils.initPlot(plotId, plotData);

        // Register for window resize
        PlotUtils.registerResize(plotId);

        // Set up click handler for residue highlighting
        var plotEl = document.getElementById(plotId);
        plotEl.on('plotly_click', function(data) {
            var checkViewerReady = setInterval(function() {
                if (typeof state !== 'undefined' && state.viewerReady === true) {
                    clearInterval(checkViewerReady);
                    if (data.points.length > 0) {
                        var curveNumber = data.points[0].curveNumber;
                        var resid = parseInt(resids[curveNumber]);

                        if (state.highlightedResid === resid) {
                            hideColor();
                            state.highlightedResid = undefined;
                        } else {
                            if (state.highlightedResid !== undefined) {
                                hideColor();
                            }
                            state.highlightedResid = resid;
                            changeColor(resid);
                        }
                    }
                }
            }, 100);
        });

        // Set up expand icon handler
        var container = plotEl.closest('.box');
        PlotUtils.setupExpandHandler(container, plotId);
    })();
    </script>
    <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
        <a href="{{ url_for('download_plot_data', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download {{ plot_info[0] }} Data</a>
        <a href="{{ url_for('download_plot', plot_id=plot_info[0], session_id=session_id) }}" class="button is-link">Download Plot</a>
    </div>
</div>
