<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculation Status — ARNy Plotter</title>
    <link href="https://cdn.jsdelivr.net/npm/bulma@0.9.3/css/bulma.min.css" rel="stylesheet" />
    <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" />
    <style>
        body, html {
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }
        .status-dot.done       { background-color: #48c774; }
        .status-dot.processing { background-color: #ffdd57; }

        .calc-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 0;
            border-bottom: 1px solid #f0f0f0;
        }
        .calc-row:last-child { border-bottom: none; }
        .calc-row .calc-name {
            flex: 1;
            font-size: 0.95em;
            color: #333;
        }
        .calc-row .calc-status {
            font-size: 0.85em;
            color: #555;
            white-space: nowrap;
        }

        #log-box {
            background: #1a1a2e;
            color: #e0e0e0;
            font-family: "Courier New", monospace;
            font-size: 0.8em;
            height: 380px;
            overflow-y: auto;
            padding: 12px 14px;
            border-radius: 4px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.55;
        }

        .refresh-note {
            font-size: 0.8em;
            color: #888;
        }
    </style>
</head>
<body>

<div style="height: 20px"></div>
<div class="container mt-5" style="max-width: 820px;">

    <!-- Header -->
    <div class="box">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 class="title" style="font-size: 2em; font-family: 'Arial', sans-serif; color: #333;">
                    Calculation Status
                </h1>
                <p class="subtitle" style="font-size: 1em; font-family: 'Georgia', serif; color: #555;">
                    Session: <code>{{ session_id }}</code>
                </p>
            </div>
            <a href="{{ url_for('index') }}" class="button is-link is-outlined">
                Back to ARNy Plotter
            </a>
        </div>
    </div>

    <!-- Overall status -->
    <div id="overall-banner" class="box mb-4" style="display:none;"></div>

    <!-- Calculations list -->
    <div class="box mb-4">
        <h2 class="title is-5" style="font-family: 'Arial', sans-serif; color: #333; margin-bottom: 0.8rem;">
            Calculations
        </h2>
        <div id="calc-list">
            <p class="has-text-grey" style="font-size: 0.9em;">Loading…</p>
        </div>
        <p id="no-plots" class="has-text-grey" style="font-size: 0.9em; display: none;">
            No calculations found — the session may still be loading.
        </p>
    </div>

    <!-- Log -->
    <div class="box mb-4">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
            <h2 class="title is-5 mb-0" style="font-family: 'Arial', sans-serif; color: #333;">
                Session Log
            </h2>
            <button class="button is-small is-light" onclick="scrollLogToBottom()">
                Scroll to bottom
            </button>
        </div>
        <div id="log-box">Waiting for log data…</div>
    </div>

    <p class="has-text-centered refresh-note" id="refresh-ts">
        Refreshing every 3 s — closing this tab does not stop your calculations.
    </p>
    <div style="height: 30px"></div>

</div>

<script>
const SESSION_ID = {{ session_id | tojson }};

const PLOT_LABELS = {
    RMSD:                "RMSD",
    ERMSD:               "eRMSD",
    CONTACT_MAPS:        "Contact Maps",
    TORSION:             "Torsion Angles",
    SEC_STRUCTURE:       "Secondary Structure",
    DOTBRACKET:          "Dot-Bracket",
    ARC:                 "Arc Diagram",
    ANNOTATE:            "Annotation",
    DS_MOTIF:            "DS Motif",
    SS_MOTIF:            "SS Motif",
    JCOUPLING:           "J-Coupling",
    ESCORE:              "eScore",
    LANDSCAPE:           "Landscape",
    BASE_PAIRING:        "Base Pairing",
    RADIUS_OF_GYRATION:  "Radius of Gyration",
    END_TO_END_DISTANCE: "End-to-End Distance",
    PCA:                 "PCA",
    UMAP:                "UMAP",
    TSNE:                "t-SNE",
};

async function refresh() {
    try {
        const r = await fetch(`/api/session-status/${SESSION_ID}`);
        if (!r.ok) return;
        const data = await r.json();
        renderStatus(data);
        document.getElementById("refresh-ts").textContent =
            `Last updated at ${new Date().toLocaleTimeString()} — closing this tab does not stop your calculations.`;
    } catch (e) {
        // silently retry
    }
}

function renderStatus(data) {
    // Overall banner
    const banner = document.getElementById("overall-banner");
    if (data.overall_done) {
        banner.style.display = "";
        banner.innerHTML =
            `All calculations are complete. &nbsp;
             <a href="/retrieve-results?session_id=${SESSION_ID}" target="_blank"
                class="button is-small is-link is-outlined ml-2">
               View Results
             </a>`;
    } else if (data.plots && data.plots.length > 0) {
        const done = data.plots.filter(p => p.status === "done").length;
        banner.style.display = "";
        banner.style.color = "#555";
        banner.style.fontFamily = "'Georgia', serif";
        banner.innerHTML = `${done} of ${data.plots.length} calculations complete.`;
    }

    // Calculation rows
    const list   = document.getElementById("calc-list");
    const noPlots = document.getElementById("no-plots");

    if (!data.plots || data.plots.length === 0) {
        list.innerHTML = "";
        noPlots.style.display = "";
    } else {
        noPlots.style.display = "none";
        list.innerHTML = data.plots.map(p => {
            const label     = PLOT_LABELS[p.name] || p.name;
            const isDone    = p.status === "done";
            const dotClass  = isDone ? "done" : "processing";
            const statusTxt = isDone ? "Done" : "Running…";
            return `
              <div class="calc-row">
                <span class="status-dot ${dotClass}"></span>
                <span class="calc-name">${label}</span>
                <span class="calc-status">${statusTxt}</span>
              </div>`;
        }).join("");
    }

    // Log — auto-scroll only when already near the bottom
    const logBox   = document.getElementById("log-box");
    const atBottom = logBox.scrollHeight - logBox.scrollTop <= logBox.clientHeight + 40;
    if (data.log) {
        logBox.textContent = data.log;
        if (atBottom) logBox.scrollTop = logBox.scrollHeight;
    }
}

function scrollLogToBottom() {
    const lb = document.getElementById("log-box");
    lb.scrollTop = lb.scrollHeight;
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
