[pytest]
# -----------------------------------------------------------------------
# Plot_RNA6 pytest configuration
# -----------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Fast unit tests, no external dependencies
    integration: Integration tests using Flask test client and real MD files
    installation: Package presence, script validity, and project structure checks
    celery: Tests that exercise Celery tasks in eager mode
    e2e: End-to-end pipeline tests (slow, require barnaba stack)
    slow: Marks tests as slow (use -m "not slow" to skip)

# Show extra test summary for all non-passing tests
addopts = -ra --tb=short

# Suppress deprecation warnings from third-party libraries
filterwarnings =
    ignore::DeprecationWarning:eventlet.*
    ignore::DeprecationWarning:celery.*
    ignore::DeprecationWarning:kombu.*
    ignore::DeprecationWarning:MDAnalysis.*
    ignore::UserWarning:MDAnalysis.*
    ignore::FutureWarning:pandas.*
    ignore::RuntimeWarning:numpy.*
